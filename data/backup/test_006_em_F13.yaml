project:
  name: AH05dacon6
  experiment_name: test_006_em_F13
  description: "EMV45 + F13 derived feature"
  seed: 42
  python_version: "3.12"

data:
  raw_dir: data/raw
  processed_dir: data/processed
  train_file: train.csv
  test_file: test.csv
  submission_file: sample_submission.csv
  target_column: SUBCLASS
  id_column: ID

model:
  name: xgboost
  objective: multi:softprob
  n_estimators: 500
  learning_rate: 0.03
  max_depth: 3
  min_child_weight: 5.0
  subsample: 0.80
  colsample_bytree: 0.65
  reg_alpha: 1.0
  reg_lambda: 10.0
  early_stopping_rounds: 25
  eval_metric: mlogloss
  tree_method: hist
  n_jobs: -1

training:
  validation_fraction: 0.2
  stratify: true
  metric: macro_f1
  overfit_threshold: 0.1

preprocessing:
  name: em_F13
  min_mutation_count: 5
  min_functional_mutation_count: 5
  min_feature_support: 2
  top_genes_per_class: 20
  smoothing: 0.5
  max_log2_odds: 8.0
  shrinkage: 10.0
  min_hotspot_count: 5
  max_hotspots: 384
  inner_signature_folds: 5
  signature_temperature: 1.0
  signature_random_state: 42
  random_state: 42

experiment_design:
  base_pipeline: em_v45
  added_feature: F13
  model: fixed_regularized_xgboost
  validation: stratified_5fold_oof
  fit_preprocessing_within_fold: true
  preserve_original_subclass: true
  external_data_used: false
  test_fit_used: false

record:
  status: not_run
  training_performed: false
  evaluation_performed: false

