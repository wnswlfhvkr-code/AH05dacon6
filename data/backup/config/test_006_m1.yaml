project:
  name: AH05dacon6
  experiment_name: test_006
  seed: 42
  python_version: "3.14"

data:
  raw_dir: data/raw
  processed_dir: data/processed
  train_file: train.csv
  test_file: test.csv
  submission_file: sample_submission.csv
  target_column: SUBCLASS
  id_column: ID

model:
  name: xgboost
  n_estimators: 500
  learning_rate: 0.03
  max_depth: 3
  min_child_weight: 5.0
  subsample: 0.75
  colsample_bytree: 0.6
  reg_alpha: 0.5
  reg_lambda: 10.0
  early_stopping_rounds: 30
  n_jobs: -1
  eval_metric: mlogloss
  tree_method: hist
  

training:
  validation_fraction: 0.2
  stratify: true
  metric: macro_f1
  overfit_threshold: 0.1

preprocessing:
  name: em_v16
  min_mutation_count: 5
  top_genes_per_class: 20
  smoothing: 0.5
  max_log2_odds: 8.0
  shrinkage: 10.0
  min_hotspot_count: 5
  max_hotspots: 384
  inner_signature_folds: 5
