project:
  name: AH05dacon6
  experiment_name: test_006_pipeComb_em_v2_009
  description: "v2_006 CatBoost를 OOF 보정·제약형 log blending으로 안정화"
  seed: 42
  python_version: "3.14"

execution:
  status: design_only
  train: false
  evaluate: false
  implementation_status: ready

data:
  raw_dir: data/raw
  processed_dir: data/processed
  train_file: train.csv
  test_file: test.csv
  submission_file: sample_submission.csv
  target_column: SUBCLASS
  id_column: ID

model:
  name: pipecomb_oof_stacking
  stacking_folds: 5
  ensemble_method: constrained_log_blend
  third_model: catboost
  early_stopping_fraction: 0.15
  text_temperature: 1.0
  xgboost_temperature: 1.0
  catboost_temperature: 1.0
  constrained_log_blend:
    temperature_candidates: [0.8, 1.0, 1.2, 1.4, 1.6, 2.0]
    initial_weights: [0.50, 0.30, 0.20]
    weight_bounds:
      text: [0.35, 0.70]
      xgboost: [0.15, 0.50]
      third: [0.05, 0.30]
    weight_l2: 0.02
    max_iter: 300
  text_linear_svc:
    C: 0.07
    class_weight: balanced
    max_iter: 20000
    tol: 0.0001
    dual: auto
  emv46_xgboost:
    objective: multi:softprob
    n_estimators: 350
    learning_rate: 0.025
    max_depth: 3
    min_child_weight: 8.0
    subsample: 0.75
    colsample_bytree: 0.55
    reg_alpha: 1.5
    reg_lambda: 15.0
    max_delta_step: 1.0
    eval_metric: mlogloss
    tree_method: hist
    n_jobs: -1
    early_stopping_rounds: 30
  emv46_catboost:
    loss_function: MultiClass
    eval_metric: MultiClass
    iterations: 450
    learning_rate: 0.020
    depth: 4
    l2_leaf_reg: 22.0
    random_strength: 1.5
    bootstrap_type: Bernoulli
    subsample: 0.70
    rsm: 0.40
    thread_count: -1
    verbose: false
    allow_writing_files: false
    early_stopping_rounds: 40
  meta_learner:
    C: 0.03
    solver: lbfgs
    class_weight: balanced
    max_iter: 3000

output:
  submission_dir: submissions
  experiment_dir: experiments

training:
  validation_fraction: 0.2
  stratify: true
  metric: macro_f1
  overfit_threshold: 0.1
  target_train_macro_f1_max: 0.70

preprocessing:
  name: pipeComb_em_v2
  text_parameters:
    word_ngram_range: [1, 2]
    word_min_df: 4
    word_max_features: 160000
    char_ngram_range: [3, 5]
    char_min_df: 6
    char_max_features: 100000
    char_weight: 0.30
    split_multi_event: false
  emv46_parameters:
    min_mutation_count: 5
    min_functional_mutation_count: 5
    min_feature_support: 2
    top_genes_per_class: 20
    smoothing: 0.5
    max_log2_odds: 8.0
    shrinkage: 10.0
    min_hotspot_count: 5
    max_hotspots: 384
    inner_signature_folds: 5
    signature_temperature: 1.0
    signature_random_state: 42
    random_state: 42
    feature_parameters:
      F05: {min_hotspot_count: 5, max_hotspots: 384}
      F10: {min_feature_support: 2}
      F12: {min_hotspot_count: 5, max_hotspots: 384}
      F16: {top_genes_per_class: 20}
      F17: {top_genes_per_class: 20}
      F18: {top_genes_per_class: 20}
      F19: {top_genes_per_class: 20}

experiment_design:
  components: [EMV46, JSJ9]
  ensemble_model: [LinearSVC, XGBoost, CatBoost]
  ensemble_method: oof_calibrated_constrained_log_probability_blending
  combined_input: model_specific_text_tree_bundle
  emv46_features_used: true
  jsj9_text_features_used: true
  jsj9_tree_features_used: false
  duplicate_jsj9_tree_removed: true
  duplicate_emv46_count: 1
  outer_oof_enabled: false
  outer_evaluation_folds: 1
  stacking_oof_folds: 5
  validation: stratified_80_20_holdout
  expected_stacking_fit_count: 2
  expected_base_model_fit_count: 36
  nested_cross_validation_removed: true
  early_stopping_split_source: inner_train_only
  early_stopping_fraction: 0.15
  early_stopping_rounds: 30
  oof_fold_used_for_early_stopping: false
  fit_preprocessing_within_fold: true
  preserve_original_subclass: true
  external_data_used: false
  test_fit_used: false

record:
  status: design_only
  training_performed: false
  evaluation_performed: false
  external_data_used: false
  intended_change: stabilize_catboost_with_oof_calibration_and_constrained_blending

experiment_variant:
  baseline: test_006_pipeComb_em_v2_006
  change_only: third_base_learner
  replaced_model: LightGBM
  replacement_model: CatBoost
  early_stopping_split_source: inner_train_only

improvement_target:
  source_validation_macro_f1: 0.5399353820
  source_train_macro_f1: 0.7620087185
  source_overfit_gap: 0.2220733365
  objective: let_oof_downweight_weak_catboost_and_reduce_text_overconfidence

