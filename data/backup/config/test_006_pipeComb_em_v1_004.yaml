project:
  name: AH05dacon6
  experiment_name: test_006_pipeComb_em_v1_004
  seed: 42

execution:
  status: design_only
  train: false
  evaluate: false
  implementation_status: ready

data:
  raw_dir: data/raw
  processed_dir: data/processed
  train_file: train.csv
  test_file: test.csv
  submission_file: sample_submission.csv
  target_column: SUBCLASS
  id_column: ID

preprocessing:
  name: pipeComb_em_v1_001
  min_mutation_count: 5
  min_functional_mutation_count: 5
  min_hotspot_count: 5
  max_hotspots: 256
  top_genes_per_class: 16
  inner_signature_folds: 5
  signature_random_state: 42
  word_ngram_range: [1, 2]
  word_min_df: 3
  word_max_features: 180000
  char_ngram_range: [3, 5]
  char_min_df: 4
  char_max_features: 120000
  char_weight: 0.4
  split_multi_event: false
  e14_parameters:
    min_mutation_count: 8
    top_genes_per_class: 12
    min_hotspot_count: 6
    max_hotspots: 192
    inner_signature_folds: 5
    random_state: 42
    smoothing: 1.0
    max_log2_odds: 6.0
    shrinkage: 20.0

model:
  name: pipecomb_weighted_soft_voting
  # broad 구성원 합계를 0.40으로 제한하고 규제형 E14에 0.60을 배정합니다.
  voting_weights:
    broad_ensemble: 0.25
    regularized_e14: 0.75
  broad_ensemble:
    weights:
      linear_svc: 0.35
      xgboost: 0.40
      lightgbm: 0.25
    linear_temperature: 1.1
    linear_svc:
      C: 0.08
      class_weight: balanced
      max_iter: 20000
      tol: 0.0001
      dual: auto
    xgboost:
      n_estimators: 280
      learning_rate: 0.025
      max_depth: 2
      min_child_weight: 12.0
      subsample: 0.70
      colsample_bytree: 0.50
      reg_alpha: 2.0
      reg_lambda: 18.0
      eval_metric: mlogloss
      tree_method: hist
      n_jobs: -1
    lightgbm:
      objective: multiclass
      n_estimators: 240
      learning_rate: 0.025
      num_leaves: 11
      max_depth: 4
      min_child_samples: 45
      subsample: 0.70
      subsample_freq: 1
      colsample_bytree: 0.50
      reg_alpha: 2.0
      reg_lambda: 18.0
      n_jobs: -1
      verbosity: -1
    pair_specialists:
      - labels: [KIRC, KIPAN]
        blend_weight: 0.05
        minimum_activation_probability: 0.70
        temperature: 1.8
        model:
          C: 0.05
      - labels: [LGG, GBMLGG]
        blend_weight: 0.05
        minimum_activation_probability: 0.70
        temperature: 1.8
        model:
          C: 0.05
  regularized_e14:
    n_estimators: 260
    learning_rate: 0.025
    max_depth: 2
    min_child_weight: 12.0
    subsample: 0.70
    colsample_bytree: 0.50
    reg_alpha: 2.0
    reg_lambda: 20.0
    eval_metric: mlogloss
    tree_method: hist
    n_jobs: -1

training:
  validation_fraction: 0.2
  stratify: true
  metric: macro_f1
  overfit_threshold: 0.1

output:
  submission_dir: submissions
  experiment_dir: experiments

record:
  status: design_only
  training_performed: false
  evaluation_performed: false
  external_data_used: false

