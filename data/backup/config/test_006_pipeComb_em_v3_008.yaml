project:
  name: AH05dacon6
  experiment_name: test_006_pipeComb_em_v3_008
  description: "v3_003 tree view에서 완전 중복과 |Pearson|>=0.98 고상관 피처를 fold-train 기준으로 제거"
  seed: 42
  python_version: "3.14"

execution:
  status: design_only
  train: false
  evaluate: false
  implementation_status: ready

data:
  raw_dir: data/raw
  processed_dir: data/processed
  train_file: train.csv
  test_file: test.csv
  submission_file: sample_submission.csv
  target_column: SUBCLASS
  id_column: ID

model:
  name: pipecomb_oof_stacking
  stacking_folds: 5
  class_weight_mode: sqrt_balanced
  class_weight_power: 0.35
  class_weight_clip: [0.85, 1.80]
  early_stopping_fraction: 0.15
  text_temperature: 1.20
  xgboost_temperature: 1.15
  lightgbm_temperature: 1.15
  text_linear_svc:
    C: 0.07
    class_weight: balanced
    max_iter: 20000
    tol: 0.0001
    dual: auto
  emv46_xgboost:
    objective: multi:softprob
    n_estimators: 350
    learning_rate: 0.025
    max_depth: 3
    min_child_weight: 8.0
    subsample: 0.75
    colsample_bytree: 0.55
    reg_alpha: 1.5
    reg_lambda: 15.0
    max_delta_step: 1.0
    eval_metric: mlogloss
    tree_method: hist
    n_jobs: -1
    early_stopping_rounds: 30
  emv46_lightgbm:
    objective: multiclass
    n_estimators: 280
    learning_rate: 0.025
    num_leaves: 11
    max_depth: 4
    min_child_samples: 45
    subsample: 0.75
    subsample_freq: 1
    colsample_bytree: 0.50
    reg_alpha: 2.0
    reg_lambda: 18.0
    n_jobs: -1
    verbosity: -1
    early_stopping_rounds: 30
  meta_learner:
    C: 0.02
    solver: lbfgs
    class_weight: balanced
    max_iter: 3000

output:
  submission_dir: submissions
  experiment_dir: experiments

training:
  validation_fraction: 0.2
  stratify: true
  metric: macro_f1
  overfit_threshold: 0.1
  target_validation_macro_f1_min: 0.570530
  target_overfit_gap_max: 0.225

preprocessing:
  name: pipeComb_em_v3
  text_parameters:
    word_ngram_range: [1, 2]
    word_min_df: 3
    word_max_features: 180000
    char_ngram_range: [3, 5]
    char_min_df: 4
    char_max_features: 120000
    char_weight: 0.4
    split_multi_event: false
  emv46_parameters:
    min_mutation_count: 5
    min_functional_mutation_count: 5
    min_feature_support: 2
    top_genes_per_class: 20
    smoothing: 0.5
    max_log2_odds: 8.0
    shrinkage: 10.0
    min_hotspot_count: 5
    max_hotspots: 384
    inner_signature_folds: 5
    signature_temperature: 1.0
    signature_random_state: 42
    random_state: 42
    feature_parameters:
      F05: {min_hotspot_count: 5, max_hotspots: 384}
      F10: {min_feature_support: 2}
      F12: {min_hotspot_count: 5, max_hotspots: 384}
      F16: {top_genes_per_class: 20}
      F17: {top_genes_per_class: 20}
      F18: {top_genes_per_class: 20}
      F19: {top_genes_per_class: 20}
  jyp9_parameters:
    f7_pairs: [[KIRC, KIPAN], [LGG, GBMLGG]]
    f7_top_k_per_direction: 3
    f7_min_gene_support: 10
    f7_laplace_alpha: 4.0
    f7_burden_quantiles: 5
    f7_stability_folds: 5
    f7_min_direction_consistency: 4
    f7_min_selection_frequency: 3
    f7_oof_folds: 5
    f7_random_state: 42
    f9_min_transition_support: 5
    f9_max_transitions: 128
    f9_burden_normalize: true
  correlation_filter_parameters:
    enabled: true
    correlation_method: pearson
    correlation_threshold: 0.98
    correlation_max_features: 5000
    correlation_block_size: 256
    min_active_count: 5
    active_epsilon: 1.0e-8

experiment_design:
  baseline: test_006_pipeComb_em_v3_003
  baseline_validation_macro_f1: 0.570530
  baseline_train_macro_f1: 0.810168
  baseline_overfit_gap: 0.239639
  change_only: emv46_tree_correlation_filter
  unchanged_components:
    - JSJ9 Word/Char TF-IDF
    - JYP9 F7 pair contrast
    - JYP9 F9 filtered composition
    - LinearSVC
    - XGBoost
    - LightGBM
    - OOF Meta-Learner
  filter_scope: emv46_numeric_tree_view_only
  filter_order:
    - minimum_active_count
    - exact_duplicate
    - high_absolute_pearson_correlation
  representative_priority:
    - clinical_interpretability_proxy
    - active_sample_support
    - variance
    - stable_original_column_order
  label_used_for_correlation_selection: false
  reason_label_free: prevent_target_leakage_into_inner_oof_stacking
  text_correlation_filtering: false
  target_aware_feature_policy: fold_train_only
  preserve_original_subclass: true
  external_data_used: false
  test_fit_used: false

acceptance_criteria:
  primary: validation_macro_f1_greater_or_equal_0.570530
  secondary: overfit_gap_less_or_equal_0.225
  safety:
    - removed_high_correlation_features_greater_than_zero
    - no_validation_or_test_statistics_used
    - no_material_drop_in_pair_class_f1

record:
  status: design_only
  training_performed: false
  evaluation_performed: false
  external_data_used: false
  intended_change: label_free_fold_train_exact_duplicate_and_high_correlation_pruning
