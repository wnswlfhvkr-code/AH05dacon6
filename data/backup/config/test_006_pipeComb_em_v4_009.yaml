  baseline: test_006_pipeComb_em_v4_004
  change_only: stronger_row_subsampling
  requested_sampling_range: [0.6, 0.8]
  xgboost_subsample: 0.65
  lightgbm_subsample: 0.65
  column_sampling_policy: preserve_existing_more_restrictive_values
  reason_not_raise_colsample: raising_0.50_or_0.45_to_0.60_would_reduce_randomness

record:
