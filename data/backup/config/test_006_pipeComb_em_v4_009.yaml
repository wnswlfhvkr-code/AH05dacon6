extends: test_006_pipeComb_em_v4_004.yaml

project:
  experiment_name: test_006_pipeComb_em_v4_009
  description: "Step 4: 기존 낮은 column sampling은 유지하고 row subsample만 0.65로 낮춘 무작위성 실험"

model:
  emv46_xgboost:
    subsample: 0.65
    colsample_bytree: 0.50
