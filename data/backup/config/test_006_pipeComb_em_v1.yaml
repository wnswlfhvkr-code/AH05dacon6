project:
  name: AH05dacon6
  experiment_name: test_006_pipeComb_em_v1
  seed: 42

execution:
  status: design_only
  train: false
  evaluate: false
  implementation_status: ready

data:
  raw_dir: data/raw
  processed_dir: data/processed
  train_file: train.csv
  test_file: test.csv
  submission_file: sample_submission.csv
  target_column: SUBCLASS
  id_column: ID

preprocessing:
  name: pipeComb_em_v1
  min_mutation_count: 2
  min_functional_mutation_count: 2
  min_hotspot_count: 3
  max_hotspots: 300
  top_genes_per_class: 20
  inner_signature_folds: 5
  signature_random_state: 42
  word_ngram_range: [1, 2]
  word_min_df: 2
  word_max_features: 250000
  char_ngram_range: [3, 5]
  char_min_df: 3
  char_max_features: 180000
  char_weight: 0.5
  split_multi_event: false

model:
  name: pipecomb_ensemble
  # 사전 고정한 보수적 시작값. 변경 시 같은 outer OOF 예측으로만 선택합니다.
  weights:
    linear_svc: 0.50
    xgboost: 0.30
    lightgbm: 0.20
  linear_temperature: 0.8
  linear_svc:
    C: 0.15
    class_weight: balanced
    max_iter: 20000
    tol: 0.0001
    dual: auto
  xgboost:
    n_estimators: 350
    learning_rate: 0.03
    max_depth: 3
    min_child_weight: 8.0
    subsample: 0.75
    colsample_bytree: 0.55
    reg_alpha: 1.0
    reg_lambda: 12.0
    eval_metric: mlogloss
    tree_method: hist
    n_jobs: -1
  lightgbm:
    objective: multiclass
    n_estimators: 300
    learning_rate: 0.03
    num_leaves: 15
    max_depth: 5
    min_child_samples: 35
    subsample: 0.75
    subsample_freq: 1
    colsample_bytree: 0.55
    reg_alpha: 1.0
    reg_lambda: 12.0
    n_jobs: -1
    verbosity: -1
  pair_specialists:
    - labels: [KIRC, KIPAN]
      blend_weight: 0.15
      minimum_activation_probability: 0.55
      temperature: 1.5
      model:
        C: 0.08
    - labels: [LGG, GBMLGG]
      blend_weight: 0.15
      minimum_activation_probability: 0.55
      temperature: 1.5
      model:
        C: 0.08

output:
  submission_dir: submissions
  experiment_dir: experiments

training:
  validation_fraction: 0.2
  stratify: true
  metric: macro_f1
  overfit_threshold: 0.1

record:
  status: design_only
  training_performed: false
  evaluation_performed: false
  external_data_used: false
