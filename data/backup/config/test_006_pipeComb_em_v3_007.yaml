project:
  name: AH05dacon6
  experiment_name: test_006_pipeComb_em_v3_007
  description: "v3_003의 세 모델을 유지하고 규제된 CatBoost OOF 확률을 추가한 4-model diversity stacking"
  seed: 42
  python_version: "3.14"

execution:
  status: design_only
  train: false
  evaluate: false
  implementation_status: ready

data:
  raw_dir: data/raw
  processed_dir: data/processed
  train_file: train.csv
  test_file: test.csv
  submission_file: sample_submission.csv
  target_column: SUBCLASS
  id_column: ID

model:
  name: pipecomb_oof_stacking
  stacking_folds: 5
  ensemble_method: regularized_stacking
  third_model: lightgbm
  fourth_model: catboost
  class_weight_mode: sqrt_balanced
  class_weight_power: 0.30
  class_weight_clip: [0.90, 1.70]
  early_stopping_fraction: 0.15
  text_temperature: 1.25
  xgboost_temperature: 1.20
  lightgbm_temperature: 1.20
  fourth_temperature: 1.25
  text_linear_svc:
    C: 0.06
    class_weight: balanced
    max_iter: 20000
    tol: 0.0001
    dual: auto
  emv46_xgboost:
    objective: multi:softprob
    n_estimators: 380
    learning_rate: 0.020
    max_depth: 3
    min_child_weight: 10.0
    subsample: 0.72
    colsample_bytree: 0.50
    reg_alpha: 2.0
    reg_lambda: 20.0
    max_delta_step: 1.0
    eval_metric: mlogloss
    tree_method: hist
    n_jobs: -1
    early_stopping_rounds: 40
  emv46_lightgbm:
    objective: multiclass
    n_estimators: 300
    learning_rate: 0.020
    num_leaves: 9
    max_depth: 4
    min_child_samples: 55
    subsample: 0.72
    subsample_freq: 1
    colsample_bytree: 0.45
    reg_alpha: 2.5
    reg_lambda: 22.0
    n_jobs: -1
    verbosity: -1
    early_stopping_rounds: 40
  emv46_catboost:
    loss_function: MultiClass
    eval_metric: MultiClass
    iterations: 320
    learning_rate: 0.020
    depth: 4
    l2_leaf_reg: 25.0
    random_strength: 2.0
    bootstrap_type: Bernoulli
    subsample: 0.70
    rsm: 0.40
    thread_count: -1
    verbose: false
    allow_writing_files: false
    early_stopping_rounds: 40
  meta_learner:
    C: 0.012
    solver: lbfgs
    class_weight: balanced
    max_iter: 3000

output:
  submission_dir: submissions
  experiment_dir: experiments

training:
  validation_fraction: 0.2
  stratify: true
  metric: macro_f1
  overfit_threshold: 0.1
  target_train_macro_f1_range: [0.77, 0.80]
  target_validation_macro_f1_min: 0.5705
  target_overfit_gap_max: 0.22

preprocessing:
  name: pipeComb_em_v3
  text_parameters:
    word_ngram_range: [1, 2]
    word_min_df: 3
    word_max_features: 180000
    char_ngram_range: [3, 5]
    char_min_df: 4
    char_max_features: 120000
    char_weight: 0.4
    split_multi_event: false
  emv46_parameters:
    min_mutation_count: 5
    min_functional_mutation_count: 5
    min_feature_support: 2
    top_genes_per_class: 20
    smoothing: 0.5
    max_log2_odds: 8.0
    shrinkage: 10.0
    min_hotspot_count: 5
    max_hotspots: 384
    inner_signature_folds: 5
    signature_temperature: 1.0
    signature_random_state: 42
    random_state: 42
    feature_parameters:
      F05: {min_hotspot_count: 5, max_hotspots: 384}
      F10: {min_feature_support: 2}
      F12: {min_hotspot_count: 5, max_hotspots: 384}
      F16: {top_genes_per_class: 20}
      F17: {top_genes_per_class: 20}
      F18: {top_genes_per_class: 20}
      F19: {top_genes_per_class: 20}
  jyp9_parameters:
    f7_pairs: [[KIRC, KIPAN], [LGG, GBMLGG]]
    f7_top_k_per_direction: 3
    f7_min_gene_support: 10
    f7_laplace_alpha: 4.0
    f7_burden_quantiles: 5
    f7_stability_folds: 5
    f7_min_direction_consistency: 4
    f7_min_selection_frequency: 3
    f7_oof_folds: 5
    f7_random_state: 42
    f9_min_transition_support: 5
    f9_max_transitions: 128
    f9_burden_normalize: true

experiment_design:
  baseline: test_006_pipeComb_em_v3_003
  change_type: new_base_model_combination
  unchanged_preprocessing: true
  ensemble: [LinearSVC, XGBoost, LightGBM, CatBoost]
  ensemble_method: four_model_single_level_oof_regularized_stacking
  catboost_role: diversity_source_not_replacement
  meta_input_per_model: [class_log_probabilities, entropy, top2_margin]
  meta_feature_count: 112
  rationale:
    - "v3_003의 강한 세 모델을 제거하지 않아 기존 성능 기반을 보존"
    - "대칭 트리와 ordered boosting 성격의 CatBoost를 추가해 트리 오차 상관을 낮춤"
    - "CatBoost 자체는 강하게 규제하고 OOF 확률만 Meta-Learner에 전달"
    - "추가된 메타 자유도를 상쇄하도록 Meta LogisticRegression L2를 강화"
  leakage_control: all_four_base_probabilities_are_cross_fitted
  external_data_used: false
  test_fit_used: false

runtime_expectation:
  relative_to_v3_003: approximately_1.25_to_1.45x
  reason: one_additional_catboost_fit_per_stacking_fold_and_final_refit

record:
  status: design_only
  training_performed: false
  evaluation_performed: false
  external_data_used: false
  intended_change: add_regularized_catboost_as_fourth_oof_diversity_model
