extends: test_006_pipeComb_em_v3_008.yaml

project:
  experiment_name: test_006_pipeComb_em_v3_011
  description: "v3_008 + API TabPFN, fold-train OOF Macro F1 기반 기존 base learner 부분집합 선택"

execution:
  status: design_only
  train: false
  evaluate: false
  implementation_status: ready

model:
  name: pipecomb_tabpfn_subset_stacking
  stacking_folds: 5
  subset_selection_folds: 5
  subset_score_tolerance: 0.001
  minimum_selected_models: 1
  reuse_fit_oof_probabilities: true
  tabpfn:
    api_key_name: tabpfn_api_key
    env_file: .env
    model_path: auto
    max_features: 512
    n_estimators: 4
    softmax_temperature: 1.0
    temperature: 1.10
    balance_probabilities: false
    ignore_pretraining_limits: false
    thinking_mode: false
  meta_learner:
    C: 0.015
    solver: lbfgs
    class_weight: balanced
    max_iter: 3000

experiment_design:
  baseline: test_006_pipeComb_em_v3_008
  change_only: api_tabpfn_with_fold_train_oof_subset_selection
  tabpfn_input: emv46_and_jyp9_numeric_tree_view
  tabpfn_feature_selection:
    method: fold_train_anova_f_classif
    max_features: 512
    validation_or_test_used: false
  candidate_policy:
    required_model: tabpfn
    optional_existing_models: [text, xgboost, lightgbm]
    candidates: 8
    selection_metric: cross_fitted_macro_f1
    tie_break: fewer_models_within_0.001
  external_input_data_used: false
  pretrained_model_used: true
  hosted_api_note: "대회 데이터의 선택된 수치 피처가 Prior Labs API로 전송됨"
  preserve_original_subclass: true
  test_fit_used: false

acceptance_criteria:
  primary: validation_macro_f1_greater_than_0.575911
  secondary: overfit_gap_less_than_0.234496
  safety:
    - all_feature_selection_fit_on_fold_train_only
    - all_subset_selection_fit_on_fold_train_oof_only
    - no_test_statistics_used
    - api_secret_not_logged_or_committed

record:
  status: design_only
  training_performed: false
  evaluation_performed: false
  external_data_used: false
  pretrained_model_used: true
  intended_change: tabpfn_api_and_oof_base_model_subset_selection
