data_dir: data/raw
output_dir: experiments/preprocessing_ablation
figure_dir: docs/assets/preprocessing_ablation

cv:
  n_splits: 3
  seeds: [42]

vectorizer:
  word_ngram_range: [1, 2]
  char_ngram_range: [3, 5]
  word_hash_features: 32768
  char_hash_features: 0
  sublinear_tf: true

model:
  C: 0.4
  class_weight: balanced
  max_iter: 3000
  tol: 0.001
