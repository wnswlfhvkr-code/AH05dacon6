project:
  experiment_name: test_008_v06
  description: "E10B-2: E10 + ID-free Word.Char TF-IDF LinearSVC + Numeric Structural LightGBM"
  python_version: "3.12"
  task_type: ensemble

data:
  raw_dir: data/raw
  train_file: train.csv
  test_file: test.csv
  submission_file: sample_submission.csv
  target_column: SUBCLASS
  id_column: ID
  fixed_split_file: data/processed/fixed_stratified_group_cv_splits.csv
  
  # 실험별 입력 결과 폴더
  # 기준 모델: test_008_v05 
  baseline_dir: data/processed/test_008_v05
  baseline_oof_file: oof_probabilities_by_seed.npy
  baseline_test_file: test_probability_by_seed_fold.npy

  # 추가 모델: Numeric Structural LightGBM
  numeric_dir: data/processed/test_008_v06_numeric
  numeric_oof_file: numeric_oof_probability_by_seed.npy
  numeric_test_file: numeric_test_probability_by_seed_fold.npy
    
  # 이번 실행 결과가 저장될 곳
  output_dir: data/processed/test_008_v06

validation:
  n_splits: 3
  seeds: [42, 2026, 777]

ensemble:
  numeric_temperatures: [0.50, 0.75, 1.00, 1.25, 1.50, 2.00]
  numeric_weights: [0.00, 0.025, 0.05, 0.075, 0.100, 0.150, 0.200]
  bootstrap_repeats: 3000
  bootstrap_seed: 20260804
