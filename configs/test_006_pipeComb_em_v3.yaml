project:
  name: AH05dacon6
  experiment_name: test_006_pipeComb_em_v3
  description: "EM46 + JSJ9 + JYP9 고유 F7/F9를 중복 없이 통합한 stacking"
  seed: 42
  python_version: "3.14"

execution:
  status: design_only
  train: false
  evaluate: false
  implementation_status: ready

data:
  raw_dir: data/raw
  processed_dir: data/processed
  train_file: train.csv
  test_file: test.csv
  submission_file: sample_submission.csv
  target_column: SUBCLASS
  id_column: ID

model:
  name: pipecomb_oof_stacking
  stacking_folds: 5
  class_weight_mode: sqrt_balanced
  class_weight_power: 0.35
  class_weight_clip: [0.85, 1.80]
  early_stopping_fraction: 0.15
  text_temperature: 1.20
  xgboost_temperature: 1.15
  lightgbm_temperature: 1.15
  text_linear_svc:
    C: 0.07
    class_weight: balanced
    max_iter: 20000
    tol: 0.0001
    dual: auto
  emv46_xgboost:
    objective: multi:softprob
    n_estimators: 350
    learning_rate: 0.025
    max_depth: 3
    min_child_weight: 8.0
    subsample: 0.75
    colsample_bytree: 0.55
    reg_alpha: 1.5
    reg_lambda: 15.0
    max_delta_step: 1.0
    eval_metric: mlogloss
    tree_method: hist
    n_jobs: -1
    early_stopping_rounds: 30
  emv46_lightgbm:
    objective: multiclass
    n_estimators: 280
    learning_rate: 0.025
    num_leaves: 11
    max_depth: 4
    min_child_samples: 45
    subsample: 0.75
    subsample_freq: 1
    colsample_bytree: 0.50
    reg_alpha: 2.0
    reg_lambda: 18.0
    n_jobs: -1
    verbosity: -1
    early_stopping_rounds: 30
  meta_learner:
    C: 0.02
    solver: lbfgs
    class_weight: balanced
    max_iter: 3000

output:
  submission_dir: submissions
  experiment_dir: experiments

training:
  validation_fraction: 0.2
  stratify: true
  metric: macro_f1
  overfit_threshold: 0.1
  target_train_macro_f1_max: 0.70

preprocessing:
  name: pipeComb_em_v3
  text_parameters:
    word_ngram_range: [1, 2]
    word_min_df: 3
    word_max_features: 180000
    char_ngram_range: [3, 5]
    char_min_df: 4
    char_max_features: 120000
    char_weight: 0.4
    split_multi_event: false
  emv46_parameters:
    min_mutation_count: 5
    min_functional_mutation_count: 5
    min_feature_support: 2
    top_genes_per_class: 20
    smoothing: 0.5
    max_log2_odds: 8.0
    shrinkage: 10.0
    min_hotspot_count: 5
    max_hotspots: 384
    inner_signature_folds: 5
    signature_temperature: 1.0
    signature_random_state: 42
    random_state: 42
    feature_parameters:
      F05: {min_hotspot_count: 5, max_hotspots: 384}
      F10: {min_feature_support: 2}
      F12: {min_hotspot_count: 5, max_hotspots: 384}
      F16: {top_genes_per_class: 20}
      F17: {top_genes_per_class: 20}
      F18: {top_genes_per_class: 20}
      F19: {top_genes_per_class: 20}
  jyp9_parameters:
    f7_pairs: [[KIRC, KIPAN], [LGG, GBMLGG]]
    f7_top_k_per_direction: 3
    f7_min_gene_support: 10
    f7_laplace_alpha: 4.0
    f7_burden_quantiles: 5
    f7_stability_folds: 5
    f7_min_direction_consistency: 4
    f7_min_selection_frequency: 3
    f7_oof_folds: 5
    f7_random_state: 42

experiment_design:
  components: [EMV46, JSJ9, JYP9]
  ensemble_model: [LinearSVC, XGBoost, LightGBM]
  ensemble_method: single_level_cross_fitted_regularized_stacking
  combined_input: model_specific_text_tree_bundle
  emv46_features_used: true
  jsj9_text_features_used: true
  jsj9_tree_features_used: false
  duplicate_jsj9_tree_removed: true
  jyp9_features_used: [F7_pair_contrast, F9_global_aa_pair_log1p]
  jyp9_fixed_feature_count: 384
  jyp9_duplicate_blocks_removed: [F0, F1, F2, F3_position, F3_aa, F4]
  jyp9_mutation_matrix_reused_from_emv46: true
  jyp9_full_rescan_removed: true
  duplicate_emv46_count: 1
  outer_oof_enabled: false
  outer_evaluation_folds: 1
  stacking_oof_folds: 5
  validation: stratified_80_20_holdout
  expected_stacking_fit_count: 2
  expected_base_model_fit_count: 36
  nested_cross_validation_removed: true
  early_stopping_split_source: inner_train_only
  early_stopping_fraction: 0.15
  early_stopping_rounds: 30
  oof_fold_used_for_early_stopping: false
  fit_preprocessing_within_fold: true
  preserve_original_subclass: true
  external_data_used: false
  test_fit_used: false

record:
  status: design_only
  training_performed: false
  evaluation_performed: false
  external_data_used: false
  intended_change: add_deduplicated_jyp9_f7_f9_to_emv46_tree_view

experiment_variant:
  baseline: test_006_pipeComb_em_v2_008
  unchanged_model_hyperparameters: true
  change_only: deduplicated_jyp9_unique_features
  target_aware_feature_policy: fold_train_only_with_internal_oof
  test_fit_used: false

improvement_target:
  objective: improve_overlapping_subclass_separation_without_duplicate_feature_growth
  primary_pairs: [[KIRC, KIPAN], [LGG, GBMLGG]]
  overfit_control: stable_gene_selection_and_oof_pair_features
