extends: test_006_pipeComb_em_v3_008.yaml

project:
  experiment_name: test_006_pipeComb_em_v3_018
  description: "v3_008 구조 유지 + effective-number alpha multiclass focal-loss MLP meta learner로 불균형 결합 재설계"

execution:
  status: design_only
  train: false
  evaluate: false
  implementation_status: ready

model:
  name: pipecomb_oof_stacking
  meta_learner:
    type: focal_mlp
    hidden_dim: 48
    dropout: 0.30
    focal_gamma: 1.50
    alpha_effective_beta: 0.99
    alpha_clip: [0.75, 2.25]
    learning_rate: 0.0007
    weight_decay: 0.015
    batch_size: 256
    max_epochs: 300
    patience: 30
    validation_fraction: 0.15
    gradient_clip_norm: 1.0
    minimum_delta: 1.0e-5
    device: cpu

training:
  target_validation_macro_f1_min: 0.575911
  target_overfit_gap_max: 0.225

baseline_result:
  experiment: test_006_pipeComb_em_v3_008
  validation_macro_f1: 0.575911
  train_macro_f1: 0.810407
  overfit_gap: 0.234496

experiment_design:
  baseline: test_006_pipeComb_em_v3_008
  isolated_change: logistic_meta_to_multiclass_focal_mlp_meta
  unchanged_components:
    - pipeComb_em_v3_preprocessing
    - emv46_fold_train_correlation_filter
    - jsj9_word_char_tfidf
    - jyp9_f7_f9_features
    - linear_svc_base_model
    - xgboost_base_model
    - lightgbm_base_model
    - base_model_oof_generation
  focal_loss_design:
    application_stage: stacking_meta_learner
    input: base_model_oof_log_probabilities_entropy_and_margin
    architecture: 84_to_48_to_26
    gamma: 1.50
    alpha: effective_number_fold_train_only
    alpha_beta: 0.99
    alpha_clip: [0.75, 2.25]
    reason_gamma_below_2: reduce_excessive_focus_on_noisy_or_conflicting_labels
  optimized_hyperparameters:
    hidden_dim: 48
    dropout: 0.30
    optimizer: AdamW
    learning_rate: 0.0007
    weight_decay: 0.015
    batch_size: 256
    maximum_epochs: 300
    early_stopping_patience: 30
    gradient_clip_norm: 1.0
  excluded_methods:
    random_oversampling:
      applied: false
      reason: duplicated_rare_mutation_patterns_increase_memorization_risk
    focal_custom_objective_per_base_tree:
      applied: false
      reason: preserve_v3_008_base_models_and_isolate_focal_meta_effect
  label_and_alpha_fit_scope: fold_train_oof_rows_only
  meta_internal_validation_scope: fold_train_oof_rows_only
  external_validation_or_test_used: false
  test_distribution_used: false
  preserve_original_subclass: true
  external_data_used: false

acceptance_criteria:
  primary: validation_macro_f1_greater_than_0.575911
  secondary: overfit_gap_less_than_0.234496
  minority_safety:
    - minority_class_f1_gain_across_multiple_classes
    - no_majority_class_f1_collapse
    - no_single_class_prediction_volume_explosion
  training_safety:
    - focal_alpha_fit_on_fold_train_labels_only
    - meta_early_stopping_uses_only_fold_train_internal_split
    - no_validation_or_test_statistics_used

record:
  status: design_only
  training_performed: false
  evaluation_performed: false
  external_data_used: false
  intended_change: v3_008_focal_loss_meta_learner_for_class_imbalance
