# JYP F9에 선택한 EM 파이프라인 블록을 내부 결합한 단일 XGBoost를 비교합니다.
# 같은 Outer Fold에서 전처리를 한 번씩 학습한 뒤 후보별 결합 행렬만 바꿉니다.

project:
  name: AH05dacon6
  experiment_name: test_003_jypF9_EM16_severity_signature_3seed
  seed: 42
  python_version: "3.14"

data:
  raw_dir: data/raw
  processed_dir: data/processed
  train_file: train.csv
  test_file: test.csv
  submission_file: sample_submission.csv
  target_column: SUBCLASS
  id_column: ID

model:
  name: xgboost
  n_estimators: 100
  learning_rate: 0.1
  max_depth: 6
  n_jobs: -1
  eval_metric: mlogloss
  tree_method: hist
  device: cuda

xgb_internal_fusion_validation:
  seeds: [101, 2027, 7301]
  n_splits: 5
  metric: macro_f1
  overfit_threshold: 0.1
  baseline_candidate: f9
  enabled_candidates:
    - f9
    - f9_em16_severity_signature
  show_progress: true
  resume: true
  submission_policy: write_local_candidates

  f9_preprocessing:
    name: jyp_f9

  companion_preprocessing:
    name: em_v16
    min_mutation_count: 5
    top_genes_per_class: 20
    smoothing: 0.5
    max_log2_odds: 8.0
    shrinkage: 10.0
    min_hotspot_count: 5
    max_hotspots: 384
    inner_signature_folds: 5
    signature_random_state: 42

  candidates:
    f9:
      companion_blocks: []
    f9_em16_severity_signature:
      companion_blocks: [severity, signature]
