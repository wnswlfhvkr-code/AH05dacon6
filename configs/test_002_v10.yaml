project:
  name: AH05dacon6
  experiment_name: test_002_v10
  seed: 42

data:
  raw_dir: data/raw
  processed_dir: data/processed/test_002_v10
  train_file: train.csv
  test_file: test.csv
  submission_file: sample_submission.csv
  target_column: SUBCLASS
  id_column: ID

validation:
  strategy: fixed_stratified_group_class_burden
  fixed_split_file: data/processed/fixed_stratified_group_cv_splits.csv
  n_splits: 3
  seeds: [42, 2026, 777]
  group: normalized_exact_mutation_profile
  burden_bins:
    boundaries: [0, 6, 10, 17, 34]
    labels: ["0-5", "6-9", "10-16", "17-33", "34+"]

preprocessing:
  name: jh_v10
  parser_version: jh_parser_v1
  f4_min_support: 5
  features:
    f0_gene_mutation_presence: true
    f1_sample_summary: true
    f2_gene_consequence: false
    f3_global_amino_acid_position: true
    f3_gene_aware_amino_acid_position: false
    f4_exact_hotspot: true
  f3_position_bins: ["1-50", "51-100", "101-200", "201-400", "401-800", "801+"]
  f1_scaling: fold_local_standard_scaler
  tfidf_sublinear_tf: true
  tfidf_norm: l2
  svd_components: 128
  svd_n_iter: 7
  svd_random_state: 42

model:
  name: lightgbm
  objective: multiclass
  n_estimators: 1200
  learning_rate: 0.025
  num_leaves: 31
  max_depth: -1
  min_child_samples: 18
  subsample: 0.85
  subsample_freq: 1
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 0.5
  class_weight: balanced
  n_jobs: -1
  verbosity: -1
  device_type: cpu
  seed_plus_fold: false
  early_stopping_rounds: 50
  eval_metric: multi_logloss

training:
  metric: macro_f1
  test_prediction: mean_probability_of_9_models
