project:
  name: AH05dacon6
  experiment_name: jsj_wc_tfidf_lsvc_lgbm_v1
  seed: 42
  python_version: "3.14"
  reference_public_macro_f1: 0.3714981583

data:
  raw_dir: data/raw
  processed_dir: data/processed
  train_file: train.csv
  test_file: test.csv
  submission_file: sample_submission.csv
  target_column: SUBCLASS
  id_column: ID

model:
  name: wc_tfidf_lsvc_lgbm
  linear_weight: 0.95
  tree_weight: 0.05
  temperature: 0.5
  class_multipliers:
    - 0.65
    - 1.14
    - 1.14
    - 1.0
    - 0.94
    - 1.0
    - 1.24
    - 1.0
    - 1.0
    - 1.14
    - 0.8
    - 1.36
    - 1.06
    - 1.06
    - 0.88
    - 1.06
    - 1.14
    - 1.14
    - 1.14
    - 1.24
    - 0.65
    - 1.0
    - 0.88
    - 0.65
    - 0.88
    - 0.88
  linear:
    C: 0.2
    class_weight: balanced
    max_iter: 10000
    tol: 0.0001
  tree:
    objective: multiclass
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 31
    max_depth: -1
    min_child_samples: 20
    subsample: 1.0
    colsample_bytree: 1.0
    reg_alpha: 0.0
    reg_lambda: 0.0
    n_jobs: -1
    verbosity: -1

training:
  validation_fraction: 0.2
  stratify: true
  metric: macro_f1

preprocessing:
  name: jsj_v1
  word_ngram_range: [1, 2]
  word_min_df: 2
  word_max_features: 250000
  char_ngram_range: [3, 5]
  char_min_df: 3
  char_max_features: 180000
  char_weight: 0.5
  sublinear_tf: true
  split_multi_event: false
  return_bundle: true
