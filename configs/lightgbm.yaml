project:
  name: AH05dacon6
  experiment_name: lightgbm
  seed: 42
  python_version: "3.14"

data:
  raw_dir: data/raw
  processed_dir: data/processed
  train_file: train.csv
  test_file: test.csv
  submission_file: sample_submission.csv
  target_column: SUBCLASS
  id_column: ID

model:
  name: lightgbm
  objective: multiclass
  n_estimators: 300
  learning_rate: 0.05
  num_leaves: 31
  max_depth: -1
  min_child_samples: 20
  subsample: 1.0
  colsample_bytree: 1.0
  reg_alpha: 0.0
  reg_lambda: 0.0
  n_jobs: -1
  verbosity: -1

training:
  validation_fraction: 0.2
  stratify: true
  metric: macro_f1

preprocessing:
  name: baseline
