project:
  name: AH05dacon6
  experiment_name: test_001
  seed: 42
  python_version: "3.14"

data:
  raw_dir: data/raw
  processed_dir: data/processed
  train_file: train.csv
  test_file: test.csv
  submission_file: sample_submission.csv
  target_column: SUBCLASS
  id_column: ID

model:
  name: xgboost
  n_estimators: 100
  learning_rate: 0.1
  max_depth: 6
  n_jobs: -1
  eval_metric: mlogloss
  tree_method: hist

training:
  validation_fraction: 0.2
  stratify: true
  metric: macro_f1

preprocessing:
  name: jsj_v1
