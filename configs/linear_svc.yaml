project:
  name: AH05dacon6
  experiment_name: linear_svc
  seed: 42
  python_version: "3.14"

data:
  raw_dir: data/raw
  processed_dir: data/processed
  train_file: train.csv
  test_file: test.csv
  submission_file: sample_submission.csv
  target_column: SUBCLASS
  id_column: ID

model:
  name: linear_svc
  C: 0.2
  class_weight: balanced
  max_iter: 10000
  tol: 0.0001

training:
  validation_fraction: 0.2
  stratify: true
  metric: macro_f1

preprocessing:
  name: jsj_v1
  word_ngram_range: [1, 2]
  word_min_df: 2
  word_max_features: 250000
  char_ngram_range: [3, 5]
  char_min_df: 3
  char_max_features: 180000
  char_weight: 0.5
  sublinear_tf: true
  split_multi_event: false
  return_bundle: false
