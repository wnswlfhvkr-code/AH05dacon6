project:
  name: AH05dacon6
  experiment_name: test_002_v09
  seed: 42
  python_version: "3.14"

data:
  raw_dir: data/raw
  processed_dir: data/processed/test_002_v09
  train_file: train.csv
  test_file: test.csv
  submission_file: sample_submission.csv
  target_column: SUBCLASS
  id_column: ID
  wt_token: WT

checks:
  expected_train_rows: 6201
  expected_test_rows: 2546
  expected_gene_count: 4384
  expected_class_count: 26
  required_unique_id: true
  required_same_gene_order: true

validation:
  strategy: stratified_group_class_burden
  n_splits: 3
  seeds:
    - 42
    - 2026
    - 777
  group: normalized_exact_mutation_profile
  burden_bins:
    boundaries:
      - 0
      - 6
      - 10
      - 17
      - 34
    labels:
      - "0-5"
      - "6-9"
      - "10-16"
      - "17-33"
      - "34+"

preprocessing:
  name: jh_v09
  parser_version: jh_parser_v1
  f4_min_support: 5
  features:
    f0_gene_mutation_presence: true
    f1_sample_summary: true
    f2_gene_consequence: false
    f3_global_amino_acid_position: true
    f3_gene_aware_amino_acid_position: false
    f4_exact_hotspot: true
  f3_position_bins:
    - "1-50"
    - "51-100"
    - "101-200"
    - "201-400"
    - "401-800"
    - "801+"
  f1_scaling: fold_local_standard_scaler
  tfidf_sublinear_tf: true
  tfidf_norm: l2

model:
  name: linear_svc
  C: 0.2
  class_weight: balanced
  max_iter: 20000
  tol: 0.0001
  dual: auto

training:
  metric: macro_f1
  test_prediction: mean_decision_score_of_9_models
