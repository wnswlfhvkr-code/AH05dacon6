project:
  name: AH05dacon6
  experiment_name: test_006_pipeComb_em_v2_001
  description: "pipeComb_em_v1_007의 EMV45 tree를 EMV46으로 교체"
  seed: 42

execution:
  status: design_only
  train: false
  evaluate: false
  implementation_status: ready

data:
  raw_dir: data/raw
  processed_dir: data/processed
  train_file: train.csv
  test_file: test.csv
  submission_file: sample_submission.csv
  target_column: SUBCLASS
  id_column: ID

preprocessing:
  name: pipeComb_em_v2_001
  text_parameters:
    word_ngram_range: [1, 2]
    word_min_df: 3
    word_max_features: 180000
    char_ngram_range: [3, 5]
    char_min_df: 4
    char_max_features: 120000
    char_weight: 0.4
    split_multi_event: false
  emv46_parameters:
    min_mutation_count: 5
    min_functional_mutation_count: 5
    min_feature_support: 2
    top_genes_per_class: 20
    smoothing: 0.5
    max_log2_odds: 8.0
    shrinkage: 10.0
    min_hotspot_count: 5
    max_hotspots: 384
    inner_signature_folds: 5
    signature_temperature: 1.0
    signature_random_state: 42
    random_state: 42
    feature_parameters:
      F05:
        min_hotspot_count: 5
        max_hotspots: 384
      F10:
        min_feature_support: 2
      F12:
        min_hotspot_count: 5
        max_hotspots: 384
      F16:
        top_genes_per_class: 20
      F17:
        top_genes_per_class: 20
      F18:
        top_genes_per_class: 20
      F19:
        top_genes_per_class: 20

model:
  name: pipecomb_oof_stacking
  stacking_folds: 5
  # Inner-fold 학습 데이터의 15%만 조기 종료 판정에 사용합니다.
  # Outer/stacking validation fold는 사용하지 않아 leakage를 방지합니다.
  early_stopping_fraction: 0.15
  text_temperature: 1.20
  xgboost_temperature: 1.15
  lightgbm_temperature: 1.15
  text_linear_svc:
    C: 0.10
    class_weight: balanced
    max_iter: 20000
    tol: 0.0001
    dual: auto
  emv46_xgboost:
    objective: multi:softprob
    n_estimators: 350
    learning_rate: 0.025
    max_depth: 3
    min_child_weight: 8.0
    subsample: 0.75
    colsample_bytree: 0.55
    reg_alpha: 1.5
    reg_lambda: 15.0
    max_delta_step: 1.0
    eval_metric: mlogloss
    tree_method: hist
    n_jobs: -1
    early_stopping_rounds: 30
  emv46_lightgbm:
    objective: multiclass
    n_estimators: 280
    learning_rate: 0.025
    num_leaves: 11
    max_depth: 4
    min_child_samples: 45
    subsample: 0.75
    subsample_freq: 1
    colsample_bytree: 0.50
    reg_alpha: 2.0
    reg_lambda: 18.0
    n_jobs: -1
    verbosity: -1
    early_stopping_rounds: 30
  meta_learner:
    C: 0.03
    solver: lbfgs
    class_weight: balanced
    max_iter: 3000

training:
  validation_fraction: 0.2
  stratify: true
  metric: macro_f1
  overfit_threshold: 0.1
  target_train_macro_f1_max: 0.70

experiment_design:
  inherited_model_design: pipeComb_em_v1_007
  text_view: JSJ9 Word/Char TF-IDF
  tree_view: EMV46
  outer_evaluation_folds: 5
  inner_stacking_folds: 5
  expected_stacking_fit_calls: 7
  expected_base_model_fit_calls: 126
  early_stopping_enabled: true
  early_stopping_split_source: inner_train_only
  early_stopping_fraction: 0.15
  early_stopping_rounds: 30
  oof_fold_used_for_early_stopping: false
  retained_emv46_instances: 1
  duplicate_emv45_tree_added: false
  jsj9_tree_excluded: true
  fit_preprocessing_within_fold: true
  preserve_original_subclass: true
  external_data_used: false
  test_fit_used: false

output:
  submission_dir: submissions
  experiment_dir: experiments

record:
  status: design_only
  training_performed: false
  evaluation_performed: false
  external_data_used: false
  intended_change: replace_emv45_tree_with_emv46_tree
